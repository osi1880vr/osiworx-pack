[project]
name = "osiworx-pack"
version = "0.1.0"
description = "Osiworx node pack. Module 'layer': token-chunked execution of big DiTs (MiniMax H3, Krea 2) to lower activation memory. Module 'wos': Megapixel Size (video/image size from an input image)."
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    # Tested only on Windows + NVIDIA CUDA (RTX 4090). Widen when tested elsewhere.
    "Operating System :: Microsoft :: Windows",
    "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/osi1880vr/osiworx-pack"
"Bug Tracker" = "https://github.com/osi1880vr/osiworx-pack/issues"

[tool.comfy]
PublisherId = "osi1880vr"
DisplayName = "osiworx-pack"
# Developed and tested against ComfyUI 0.39.0
requires-comfyui = ">=0.39.0"
